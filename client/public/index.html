<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/assert/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
    <meta name="theme-color" content="#388e3c" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Uzhavar Connect - Farm Management Platform</title>
    <meta name="description" content="Manage your farm like a pro. From Soil to Sale with Uzhavar Connect - AMC, planting, irrigation, fencing, and more." />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    
    <!-- Google Translate Script -->
    <script type="text/javascript">
      // Suppress Google Translate errors
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('insertBefore')) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }, true);
      
      function googleTranslateElementInit() {
        // Wait for React to fully mount before initializing
        setTimeout(function() {
          try {
            new google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'en,ta',
              layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
              autoDisplay: false
            }, 'google_translate_element');
          } catch(e) {
            // Silently handle initialization errors
          }
        }, 3000);
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
    <!-- Hidden Google Translate Element -->
    <div id="google_translate_element" style="display: none;"></div>
    
    <!-- CSS to hide Google Translate UI -->
    <style>
      /* Hide Google Translate banner and elements */
      .goog-te-banner-frame.skiptranslate {
        display: none !important;
      }
      
      body {
        top: 0px !important;
      }
      
      .goog-te-balloon-frame {
        display: none !important;
      }
      
      .goog-tooltip {
        display: none !important;
      }
      
      .goog-tooltip:hover {
        display: none !important;
      }
      
      .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
      }
      
      #google_translate_element {
        display: none !important;
      }
      
      .skiptranslate {
        display: none !important;
      }
      
      /* Hide Google Translate top frame */
      iframe.skiptranslate {
        display: none !important;
      }
      
      body > .skiptranslate {
        display: none !important;
      }
    </style>
  </body>
</html>
